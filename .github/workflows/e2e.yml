name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # docs-cloak is a separate repo in the same org and is what the app actually
      # talks to — the e2e suite exercises the real detect/redact pipeline, not a mock.
      # If docs-cloak is private, add a fine-grained PAT with read access to it as the
      # DOCS_CLOAK_REPO_TOKEN secret in this repo's settings; falls back to the default
      # token (works fine if docs-cloak is public).
      - name: Checkout backend (docs-cloak)
        uses: actions/checkout@v4
        with:
          repository: xsentry-labs/docs-cloak
          path: docs-cloak-backend
          token: ${{ secrets.DOCS_CLOAK_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install backend dependencies
        working-directory: docs-cloak-backend
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: docs-cloak-backend
        env:
          ALLOWED_ORIGINS: "http://localhost:3100"
          # Generous for CI: several specs hit /v1/redact within the same minute.
          RATE_LIMIT_PER_MINUTE: "200"
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 3000 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "Backend did not become healthy in time"; cat backend.log; exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          CI: "true"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
